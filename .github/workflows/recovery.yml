name: Piano recovery
on:
  workflow_dispatch:
    inputs:
      flavor:
        description: Recovery to build
        type: choice
        default: both
        options: [both, twrp, ofox]
permissions:
  contents: read
concurrency:
  group: recovery-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    name: ${{ matrix.flavor }} / HyperOS 4
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        flavor: [twrp, ofox]
    steps:
      - uses: actions/checkout@v4
        if: inputs.flavor == 'both' || inputs.flavor == matrix.flavor
        with:
          path: device-tree
          persist-credentials: false
      - name: Prepare hosted runner
        if: inputs.flavor == 'both' || inputs.flavor == matrix.flavor
        run: |
          # Hosted runner only: reclaim unused preinstalled SDKs.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache /usr/share/swift /usr/local/share/powershell \
            /usr/share/miniconda /opt/az /usr/local/julia* /usr/local/share/chromium
          sudo docker image prune --all --force
          sudo apt-get clean
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev libc6-dev-i386 libncurses-dev x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig python3 openssl cpio lz4 rsync
          mkdir -p "$HOME/bin"
          curl --fail --location --retry 3 https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          df -h .
      - name: Sync pinned source
        if: inputs.flavor == 'both' || inputs.flavor == matrix.flavor
        env:
          FLAVOR: ${{ matrix.flavor }}
        shell: bash
        run: |
          set -eo pipefail
          mkdir source
          cd source
          metadata=../device-tree/manifests/baseline.json
          if [[ "$FLAVOR" = ofox ]]; then metadata=../device-tree/manifests/ofox-baseline.json; fi
          url=$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["manifest_url"])' "$metadata")
          revision=$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["manifest_commit"])' "$metadata")
          git config --global user.name "Piano Recovery CI"
          git config --global user.email "recovery-ci@users.noreply.github.com"
          repo init -u "$url" -b "$revision" --depth=1 --no-use-superproject --partial-clone --clone-filter=blob:none
          mkdir -p .repo/local_manifests
          cp "../device-tree/manifests/$FLAVOR-pins.xml" .repo/local_manifests/piano-pins.xml
          python3 ../device-tree/tools/ci-sync.py 2>&1 | tee ../sync.log
          mkdir -p device/xiaomi/piano
          rsync -a --exclude=.git ../device-tree/ device/xiaomi/piano/
      - name: Build and verify
        if: inputs.flavor == 'both' || inputs.flavor == matrix.flavor
        env:
          FLAVOR: ${{ matrix.flavor }}
          PIANO_BUILD_JOBS: '2'
        shell: bash
        run: |
          set -eo pipefail
          cd source
          # Ephemeral development key; never uploaded or used as release signing.
          mkdir -p device/xiaomi/piano/security
          (umask 077; openssl genrsa -out device/xiaomi/piano/security/recovery_avb.pem 4096)
          bash device/xiaomi/piano/tools/build-recovery.sh "$FLAVOR"
          mkdir -p ../artifacts
          cp out/target/product/piano/recovery.img "../artifacts/piano-$FLAVOR-recovery.img"
          sha256sum "../artifacts/piano-$FLAVOR-recovery.img" > "../artifacts/piano-$FLAVOR-recovery.img.sha256"
      - name: Upload verified image
        if: success() && (inputs.flavor == 'both' || inputs.flavor == matrix.flavor)
        uses: actions/upload-artifact@v4
        with:
          name: piano-${{ matrix.flavor }}-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
      - name: Upload diagnostics
        if: always() && (inputs.flavor == 'both' || inputs.flavor == matrix.flavor)
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.flavor }}-${{ github.run_number }}
          path: |
            sync.log
            source/sync-storage.json
            source/recovery-build-logs/
            source/out/soong/error.log
            source/out/soong/build.ninja.log
          if-no-files-found: warn
          retention-days: 14
