name: Build recovery

on:
  workflow_dispatch:
    inputs:
      recovery:
        description: Recovery to build
        type: choice
        default: both
        options: [both, twrp, orangefox]
      release:
        description: Publish a GitHub release
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.recovery }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        recovery: ${{ fromJSON(inputs.recovery == 'both' && '["twrp","orangefox"]' || format('["{0}"]', inputs.recovery)) }}
    steps:
      - name: Remove preinstalled tools
        uses: rokibhasansagar/slimhub_actions@main

      - name: Maximize build space
        uses: easimon/maximize-build-space@master

      - name: Check out the device tree
        uses: actions/checkout@v4
        with:
          path: device-tree

      - name: Set up the build host
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib \
            gcc-multilib git git-lfs gnupg gperf lib32ncurses-dev lib32z1-dev liblz4-tool \
            libncurses-dev libssl-dev libxml2-utils lz4 python3 rsync schedtool squashfs-tools \
            unzip xsltproc zip zlib1g-dev
          mkdir -p ~/bin
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o ~/bin/repo
          chmod +x ~/bin/repo
          echo ~/bin >> "$GITHUB_PATH"
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@users.noreply.github.com"

      - name: Sync the recovery source
        run: |
          mkdir src
          if [ "${{ matrix.recovery }}" = orangefox ]; then
            manifest=https://gitlab.com/OrangeFox/Manifest.git branch=fox_16.0
          else
            manifest=https://github.com/TWRP-Test/platform_manifest_twrp_aosp.git branch=twrp-16.0
          fi
          cd src
          repo init -u $manifest -b $branch --depth=1
          repo sync -c -j8 --force-sync --no-clone-bundle --no-tags
          cd ..
          rsync -a --exclude=.git device-tree/ src/device/xiaomi/piano/
          df -h src

      - name: Build
        run: |
          cd src
          [ "${{ matrix.recovery }}" = orangefox ] && export PIANO_FOX=1
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          lunch twrp_piano-bp2a-eng
          m recoveryimage -j$(nproc)

      - name: Name the image
        id: image
        run: |
          date=$(date +%Y%m%d)
          name=${{ matrix.recovery }}-piano-$date.img
          [ "${{ matrix.recovery }}" = twrp ] && name=TWRP-16-piano-$date.img
          [ "${{ matrix.recovery }}" = orangefox ] && name=OrangeFox-R12-piano-$date.img
          mkdir out
          cp src/out/target/product/piano/recovery.img out/$name
          (cd out && sha256sum $name > $name.sha256)
          echo "date=$date" >> "$GITHUB_OUTPUT"

      - name: Upload the image
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.recovery }}-piano
          path: out/*

      - name: Upload the build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.recovery }}-log
          path: src/out/error.log
          if-no-files-found: ignore

      - name: Publish the release
        if: inputs.release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ matrix.recovery }}-${{ steps.image.outputs.date }}
          name: ${{ matrix.recovery == 'twrp' && 'TWRP' || 'OrangeFox' }} for the Xiaomi Pad 8 Pro (${{ steps.image.outputs.date }})
          files: out/*
          body: |
            Recovery for the Xiaomi Pad 8 Pro (piano). Works with HyperOS 3 and 4,
            Android 16 and 17, and AOSP ROMs built on that firmware.

            Install from the bootloader:

                fastboot flash recovery_a ${{ matrix.recovery == 'twrp' && 'TWRP-16' || 'OrangeFox-R12' }}-piano-${{ steps.image.outputs.date }}.img
                fastboot flash recovery_b ${{ matrix.recovery == 'twrp' && 'TWRP-16' || 'OrangeFox-R12' }}-piano-${{ steps.image.outputs.date }}.img
                fastboot reboot recovery
