name: Build recovery

on:
  workflow_dispatch:
    inputs:
      recovery:
        description: Recovery to build
        type: choice
        default: all
        options: [all, twrp, yarp, orangefox]
      release:
        description: Publish a GitHub release
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.recovery }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        recovery: ${{ fromJSON(inputs.recovery == 'all' && '["twrp","yarp","orangefox"]' || format('["{0}"]', inputs.recovery)) }}
    steps:
      - name: Remove preinstalled tools
        uses: rokibhasansagar/slimhub_actions@c2a6e4317d3de2b623ac7395b05e9d2149e8289b # main

      - name: Set up the build host
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib \
            gcc-multilib git git-lfs gnupg gperf lib32ncurses-dev lib32z1-dev liblz4-tool \
            libncurses-dev libssl-dev libxml2-utils lz4 python3 rsync schedtool squashfs-tools \
            unzip xsltproc zip zlib1g-dev
          mkdir -p ~/bin
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o ~/bin/repo
          # Update the checksum when Google publishes a new repo launcher.
          echo "05f571deafd6ed6da0d20fa707dde29aa5624dbf35553d697a40dbdd4c8d178a  $HOME/bin/repo" | sha256sum -c -
          chmod +x ~/bin/repo
          echo ~/bin >> "$GITHUB_PATH"
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@users.noreply.github.com"

      - name: Maximize build space
        uses: easimon/maximize-build-space@c28619d8999a147d5e09c1199f84ff6af6ad5794 # master
        with:
          # repo, git and the runner itself still write to the root disk.
          root-reserve-mb: 8192
          swap-size-mb: ${{ matrix.recovery == 'orangefox' && 6144 || 14336 }}

      - name: Set up zram
        run: |
          # Soong's analysis needs more memory than the runner has.
          # The Azure kernels ship zram in linux-modules-extra when they
          # don't build it in; skip zram if neither has it.
          if ! sudo modprobe zram; then
            sudo apt-get update
            sudo apt-get install -y linux-modules-extra-$(uname -r) && sudo modprobe zram ||
              { echo "no zram on this runner"; exit 0; }
          fi
          size=$(( $(awk '/MemTotal/ {print $2}' /proc/meminfo) * 9 / 10 ))K
          dev=$(sudo zramctl --find --size $size --algorithm zstd)
          sudo mkswap $dev
          sudo swapon -p 1000 $dev
          swapon --show
          free -h

      - name: Check out the device tree
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: device-tree

      - name: Sync the recovery source
        run: |
          mkdir src
          if [ "${{ matrix.recovery }}" = orangefox ]; then
            manifest=https://gitlab.com/OrangeFox/Manifest.git branch=fox_16.0
          else
            manifest=https://github.com/TWRP-Test/platform_manifest_twrp_aosp.git branch=twrp-16.0
          fi
          [ "${{ matrix.recovery }}" = yarp ] && export PIANO_YARP=1
          [ "${{ matrix.recovery }}" = orangefox ] && export PIANO_FOX=1
          (cd src && bash ../device-tree/tools/ci-sync.sh $manifest $branch)
          # The build needs only the checked-out files: drop the git objects.
          rm -rf src/.repo/project-objects src/.repo/projects
          find src -mindepth 2 -maxdepth 6 -name .git -prune -exec rm -rf {} +
          mkdir -p src/device/xiaomi/piano
          rsync -a --exclude=.git device-tree/ src/device/xiaomi/piano/
          df -h src

      - name: Build
        shell: bash
        run: |
          set +e
          cd src
          [ "${{ matrix.recovery }}" = orangefox ] && export PIANO_FOX=1
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          # Keep Soong's Go analysis inside the runner's memory: collect
          # garbage early and build one job at a time.
          export GOGC=50 GOMEMLIMIT=10GiB
          lunch twrp_piano-bp2a-eng
          m recoveryimage -j1 || exit 1

      - name: Name the image
        id: image
        run: |
          date=$(date +%Y%m%d)
          name=${{ matrix.recovery }}-piano-$date.img
          [ "${{ matrix.recovery }}" = twrp ] && name=TWRP-16-piano-$date.img
          [ "${{ matrix.recovery }}" = yarp ] && name=YARP-16-piano-$date.img
          [ "${{ matrix.recovery }}" = orangefox ] && name=OrangeFox-R12-piano-$date.img
          mkdir out
          cp src/out/target/product/piano/recovery.img out/$name
          (cd out && sha256sum $name > $name.sha256)
          echo "date=$date" >> "$GITHUB_OUTPUT"

      - name: Upload the image
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.recovery }}-piano
          path: out/*

      - name: Upload the build log
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.recovery }}-log
          path: src/out/error.log
          if-no-files-found: ignore

  release:
    name: release ${{ matrix.recovery }}
    # Publish only when every requested recovery built.
    needs: build
    if: inputs.release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    strategy:
      matrix:
        recovery: ${{ fromJSON(inputs.recovery == 'all' && '["twrp","yarp","orangefox"]' || format('["{0}"]', inputs.recovery)) }}
    steps:
      - name: Download the image
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ matrix.recovery }}-piano
          path: out

      - name: Name the release
        id: image
        run: |
          case ${{ matrix.recovery }} in
            twrp) label=TWRP ;;
            yarp) label=YARP ;;
            orangefox) label=OrangeFox ;;
          esac
          img=$(cd out && ls *.img)
          date=${img%.img}; date=${date##*-}
          echo "label=$label" >> "$GITHUB_OUTPUT"
          echo "img=$img" >> "$GITHUB_OUTPUT"
          echo "date=$date" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ matrix.recovery }}-${{ steps.image.outputs.date }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.image.outputs.label }} for the Xiaomi Pad 8 Pro (${{ steps.image.outputs.date }})
          files: out/*
          body: |
            Recovery for the Xiaomi Pad 8 Pro (piano). Works with HyperOS 3 and 4,
            Android 16 and 17, and AOSP ROMs built on that firmware.

            Install from the bootloader:

                fastboot flash recovery_a ${{ steps.image.outputs.img }}
                fastboot flash recovery_b ${{ steps.image.outputs.img }}
                fastboot reboot recovery
